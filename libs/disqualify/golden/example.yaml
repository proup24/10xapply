  - id: near-years-yes-no
    group: near-miss
    questions:
      - label: Do you have 5 or more years of experience with TypeScript?
        type: radio
        options: [Yes, 'No']
    expect:
      verdict: pass
      claims: []

  # --------------------------------------------------------------- location
  # The rules say locatedIn: [MA]. A skip case lists only the deciding claim;
