<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typing practice</title>
    <style>
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        display: block;
        width: 100%;
        height: 7rem;
        margin: 1rem 0;
        padding: 0.5rem;
        font: inherit;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Typing practice</h1>
    <p>Type anything; nothing is kept.</p>
    <textarea aria-label="First"></textarea>
    <textarea aria-label="Second"></textarea>
    <textarea aria-label="Third"></textarea>
  </body>
</html>
